name: Add a watch

on:
  workflow_dispatch:
    inputs:
      url:
        description: "HMT product page link (https://www.hmtwatches.in/product_all_details?id=...)"
        required: true
        type: string
      name:
        description: "Optional display name"
        required: false
        type: string

concurrency:
  group: hmt-config
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  add:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Resolve product and add to config
        env:
          PRODUCT_URL: ${{ inputs.url }}
          PRODUCT_NAME: ${{ inputs.name }}
        run: |
          if [ -n "$PRODUCT_NAME" ]; then
            python -m src.add_target "$PRODUCT_URL" --name "$PRODUCT_NAME"
          else
            python -m src.add_target "$PRODUCT_URL"
          fi

      - name: Commit config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/targets.yml
          if git diff --cached --quiet; then echo "nothing to add"; exit 0; fi
          git commit -m "config: add watch" --quiet
          for i in 1 2 3; do
            if git pull --rebase --quiet && git push --quiet; then exit 0; fi
            sleep 5
          done
          exit 1
