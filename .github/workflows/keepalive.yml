name: Keep schedule alive

# GitHub disables scheduled workflows in public repos after 60 days without
# repository activity. Re-enabling them through the API twice a month keeps the
# monitor running without dummy commits.
on:
  schedule:
    - cron: "17 13 1,15 * *"
      timezone: "Asia/Kolkata"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Re-enable scheduled workflows
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          for wf in monitor.yml keepalive.yml; do
            gh api -X PUT "repos/$REPO/actions/workflows/$wf/enable" && echo "enabled $wf"
          done
